<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Responder cotação</title><meta name="viewport" content="width=device-width, initial-scale=1"><script src="firebase-config.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script><style>body{margin:0;background:#f4f7fb;font-family:Arial;color:#172033}main{max-width:900px;margin:auto;padding:14px}.card,.item{background:#fff;border:1px solid #d9e2ef;border-radius:18px;padding:15px;margin:12px 0;box-shadow:0 10px 28px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}input,textarea,select{width:100%;border:1px solid #d9e2ef;border-radius:12px;padding:10px}label{display:block;font-weight:bold;margin:8px 0 4px}button{border:0;border-radius:12px;padding:11px 14px;background:#1d4ed8;color:white;font-weight:bold;margin:3px}.green{background:#15803d}.red{background:#dc2626}.pill{display:inline-block;background:#f8fafc;border:1px solid #d9e2ef;border-radius:999px;padding:5px 8px;margin:2px;font-size:12px}.muted{color:#667085}.footer{text-align:center;color:#64748b;padding:20px}</style></head><body><main><h1>🧾 Responder cotação</h1><div id="app">Carregando...</div></main><div class="footer">Powered by thIAguinho Soluções Digitais</div><script>const ASSINATURA='Powered by thIAguinho Soluções Digitais';let db,qid,sid,token,quote={},supplier={};const $=id=>document.getElementById(id);function qs(k){return new URLSearchParams(location.search).get(k)||''}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function parseMoney(v){let s=String(v||'').replace(/[^\d,.-]/g,'').trim();if(!s)return 0;if(s.includes(',')&&s.includes('.'))s=s.replace(/\./g,'').replace(',','.');else if(s.includes(','))s=s.replace(',','.');const n=Number(s);return Number.isFinite(n)?n:0}function money(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}function init(){firebase.initializeApp(window.firebaseConfig);db=firebase.database();qid=qs('q');sid=qs('s');token=qs('t');if(!qid||!sid)return $('app').innerHTML='<div class="card">Link inválido.</div>';db.ref('quotes/'+qid).on('value',s=>{quote=s.val()||{};db.ref('suppliers/'+sid).once('value').then(x=>{supplier=x.val()||{};render()})})}function items(){return quote.items||[]}function render(){if(!quote.id)return $('app').innerHTML='<div class="card">Cotação não encontrada.</div>';const link=quote.links&&quote.links[sid];if(link&&link.token&&token&&link.token!==token)return $('app').innerHTML='<div class="card">Link não autorizado.</div>';if(quote.status==='closed')return $('app').innerHTML='<div class="card"><h2>Cotação encerrada</h2><p>Esta cotação não está mais disponível.</p></div>';const resp=(quote.responses&&quote.responses[sid])||{};$('app').innerHTML=`<div class='card'><h2>${esc(supplier.name||'Fornecedor')}</h2><p><b>Cotação:</b> ${esc(quote.number||qid)}<br><b>Veículo:</b> ${esc([quote.vehicle?.brand,quote.vehicle?.model,quote.vehicle?.plate].filter(Boolean).join(' ')||'-')}</p></div>${items().map((it,i)=>{const r=resp[it.id]||{};return `<div class='item'><h2>${i+1}. ${esc(it.desc)}</h2><p><span class='pill'>Cód: ${esc(it.oem||'-')}</span><span class='pill'>Qtd: ${esc(it.qty||1)}</span>${it.saleTotal?`<span class='pill'>Ref: ${money(it.saleTotal)}</span>`:''}</p><div><button class='green' onclick="mark('${it.id}',true)">Tenho</button><button class='red' onclick="mark('${it.id}',false)">Não tenho</button></div><div class='grid'><div><label>Tenho?</label><select id='av_${it.id}'><option value='true' ${r.available!==false?'selected':''}>Sim</option><option value='false' ${r.available===false?'selected':''}>Não</option></select></div><div><label>Marca</label><input id='brand_${it.id}' value='${esc(r.brand||'')}'></div><div><label>Cód. marca</label><input id='bc_${it.id}' value='${esc(r.brandCode||'')}'></div><div><label>Preço unitário</label><input id='price_${it.id}' value='${esc(r.price||'')}'></div><div><label>Disponibilidade</label><input id='disp_${it.id}' value='${esc(r.availability||'')}'></div></div><label>Descrição</label><input id='desc_${it.id}' value='${esc(r.desc||it.desc||'')}'><label>Obs.</label><textarea id='obs_${it.id}'>${esc(r.obs||'')}</textarea><button class='green' onclick="saveItem('${it.id}')">Salvar item</button> <span id='st_${it.id}' class='muted'></span></div>`}).join('')}<div class='card'><button class='green' onclick='saveAll()'>Salvar tudo</button></div>`}function mark(id,val){$('av_'+id).value=val?'true':'false';if(!val){$('price_'+id).value='';$('disp_'+id).value='indisponível'}}function payload(id){return {available:$('av_'+id).value==='true',brand:$('brand_'+id).value.trim(),brandCode:$('bc_'+id).value.trim(),price:parseMoney($('price_'+id).value),availability:$('disp_'+id).value.trim(),desc:$('desc_'+id).value.trim(),obs:$('obs_'+id).value.trim(),updatedAt:Date.now(),signature:ASSINATURA}}function saveItem(id){const p=payload(id);return db.ref(`quotes/${qid}/responses/${sid}/${id}`).set(p).then(()=>{const st=$('st_'+id);if(st)st.textContent=' salvo';const it=items().find(x=>x.id===id);if(it&&p.available&&p.price>0){const priceId=`auto_${sid}_${(it.oem||id).replace(/[^a-z0-9]/gi,'_')}`;db.ref('priceDb/'+priceId).update({supplierId:sid,oem:it.oem||'',desc:p.desc||it.desc,brand:p.brand,brandCode:p.brandCode,price:p.price,availability:p.availability,obs:p.obs,updatedAt:Date.now(),signature:ASSINATURA})}})}function saveAll(){Promise.all(items().map(i=>saveItem(i.id))).then(()=>alert('Cotação salva. Obrigado!'))}window.addEventListener('load',init);</script></body></html>
